services:
  db:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    command: ['postgres', '-c', 'wal_level=logical']
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
