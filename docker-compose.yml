services:
  db:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    command: ['postgres', '-c', 'wal_level=logical']
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
