name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: app
            dockerfile: Dockerfile.app
            target: app-runtime
          - name: migrate
            dockerfile: Dockerfile.app
            target: migrate-runtime
          - name: zero
            dockerfile: Dockerfile.zero
            target: ''
          - name: drizzle
            dockerfile: Dockerfile.drizzle
            target: ''
    name: Build and push ${{ matrix.service.name }} image
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Read package version
        id: package-version
        run: echo "value=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=sha-${{ github.sha }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.package-version.outputs.value }},enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push targeted Docker image
        if: matrix.service.target != ''
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}

      - name: Build and push default Docker image
        if: matrix.service.target == ''
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}

      - name: Image digest
        run: echo "Image pushed with tags:${{ steps.meta.outputs.tags }}"

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: format
            command: pnpm exec prettier --check .
          - name: lint
            command: NODE_OPTIONS=--max-semi-space-size=256 pnpm exec eslint --cache --cache-location node_modules .
          - name: check
            command: pnpm check
    name: Verify ${{ matrix.task.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Zero schema
        if: matrix.task.name != 'format'
        run: pnpm zero:generate

      - name: Run ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}

  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Smoke test
    env:
      DATABASE_URL: postgres://root:mysecretpassword@localhost:5432/local
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Same images and cache as the build job, loaded locally instead of pushed.
      - name: Build app image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile.app
          target: app-runtime
          load: true
          tags: refinery-app:smoke
          cache-from: type=gha
          platforms: linux/amd64

      - name: Build zero image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile.zero
          load: true
          tags: refinery-zero:smoke
          platforms: linux/amd64

      - name: Start Postgres
        run: |
          docker compose -p refinery-smoke up -d db
          timeout 60 sh -c 'until docker compose -p refinery-smoke exec -T db pg_isready -U root -d local; do sleep 1; done'

      # The app runs migrations on startup, so zero-cache starts once it is up.
      - name: Start app
        run: |
          docker run -d --name app --network host \
            -e NODE_ENV=production -e PORT=3000 \
            -e DATABASE_URL -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e PUBLIC_SERVER=http://localhost:4848 \
            refinery-app:smoke
          timeout 90 sh -c 'until curl -fs http://localhost:3000/api/version; do sleep 1; done'

      - name: Start zero-cache
        run: |
          docker run -d --name zero --network host \
            -e ZERO_APP_ID=refinery -e ZERO_NUM_SYNC_WORKERS=1 \
            -e ZERO_UPSTREAM_DB="$DATABASE_URL" -e ZERO_REPLICA_FILE=/tmp/sync-replica.db \
            -e ZERO_QUERY_URL=http://localhost:3000/api/zero/get-queries -e ZERO_QUERY_FORWARD_COOKIES=true \
            -e ZERO_MUTATE_URL=http://localhost:3000/api/zero/mutate -e ZERO_MUTATE_FORWARD_COOKIES=true \
            -e ZERO_ADMIN_PASSWORD=smoke \
            refinery-zero:smoke
          timeout 90 sh -c 'until curl -fs http://localhost:4848/keepalive; do sleep 1; done'

      - name: Run smoke test
        run: node scripts/smoke.ts

      - name: Show container logs
        if: failure()
        run: |
          docker logs app 2>&1 | tail -100
          docker logs zero 2>&1 | tail -100

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore

  resolve-deploy-plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deployments: ${{ steps.resolve.outputs.deployments }}
      needs_migration: ${{ steps.resolve.outputs.needs_migration }}
      app_changed: ${{ steps.resolve.outputs.app_changed }}
      zero_changed: ${{ steps.resolve.outputs.zero_changed }}
      promote_app: ${{ steps.resolve.outputs.promote_app }}
      promote_migrate: ${{ steps.resolve.outputs.promote_migrate }}
      promote_zero: ${{ steps.resolve.outputs.promote_zero }}
    steps:
      - name: Resolve deploy plan from merged PR
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const migrationPattern = /^drizzle\/[^/]+\.sql$/;
            const appPatterns = [
              /^src\//,
              /^drizzle\//,
              /^drizzle\.config\.ts$/,
              /^drizzle-zero\.config\.ts$/,
              /^package\.json$/,
              /^pnpm-lock\.yaml$/,
              /^pnpm-workspace\.yaml$/,
              /^components\.json$/,
              /^Dockerfile\.app$/,
              /^scripts\/run-migrations\.js$/
            ];
            const migratePatterns = [
              /^drizzle\//,
              /^package\.json$/,
              /^pnpm-lock\.yaml$/,
              /^pnpm-workspace\.yaml$/,
              /^Dockerfile\.app$/,
              /^scripts\/run-migrations\.js$/
            ];
            const zeroPatterns = [
              /^Dockerfile\.zero$/
            ];

            function matchesAny(filename, patterns) {
              return patterns.some((pattern) => pattern.test(filename));
            }

            const prs = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner,
                repo,
                commit_sha: context.sha,
                per_page: 100,
              },
              (response) => response.data
            );

            const pr =
              prs.find((candidate) => candidate.base?.ref === 'main' && candidate.merged_at) ??
              prs.find((candidate) => candidate.base?.ref === 'main') ??
              null;

            let changedFiles = [];

            if (pr) {
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                },
                (response) => response.data
              );
              changedFiles = files.map((file) => file.filename);
            } else {
              const before = context.payload.before;
              if (before && before !== '0000000000000000000000000000000000000000') {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${before}...${context.sha}`,
                });
                changedFiles = (comparison.data.files ?? []).map((file) => file.filename);
              }
            }

            const changedMigrationFiles = changedFiles.filter((filename) => migrationPattern.test(filename));
            const needsMigration = changedMigrationFiles.length > 0;
            const appChanged = changedFiles.some((filename) => matchesAny(filename, appPatterns));
            const migrateChanged = changedFiles.some((filename) => matchesAny(filename, migratePatterns));
            const zeroChanged = changedFiles.some((filename) => matchesAny(filename, zeroPatterns));
            const deployments = [
              appChanged ? 'refinery-app' : null,
              zeroChanged ? 'refinery-zero' : null,
            ]
              .filter(Boolean)
              .join(',');

            const promoteApp = appChanged;
            const promoteMigrate = migrateChanged;
            const promoteZero = zeroChanged;

            await core.summary
              .addHeading('Resolved Deploy Plan')
              .addRaw(`Commit: ${context.sha}\n\n`)
              .addRaw(`Pull request: ${pr ? `#${pr.number}` : 'none'}\n\n`)
              .addRaw(
                `Changed files: ${changedFiles.length > 0 ? changedFiles.join(', ') : 'none detected'}\n\n`
              )
              .addRaw(
                `Migration files: ${
                  changedMigrationFiles.length > 0 ? changedMigrationFiles.join(', ') : 'none'
                }\n\n`
              )
              .addRaw(
                `App startup migration path: ${needsMigration ? 'enabled for this rollout' : 'not needed'}\n\n`
              )
              .addRaw(`Deployments: ${deployments || 'none'}\n\n`)
              .addRaw(
                `Promotions: app=${promoteApp}, migrate=${promoteMigrate}, zero=${promoteZero}\n`
              )
              .write();

            core.setOutput('deployments', deployments);
            core.setOutput('needs_migration', needsMigration ? 'true' : 'false');
            core.setOutput('app_changed', appChanged ? 'true' : 'false');
            core.setOutput('zero_changed', zeroChanged ? 'true' : 'false');
            core.setOutput('promote_app', promoteApp ? 'true' : 'false');
            core.setOutput('promote_migrate', promoteMigrate ? 'true' : 'false');
            core.setOutput('promote_zero', promoteZero ? 'true' : 'false');

  promote-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - build
      - verify
      - resolve-deploy-plan
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote production tags
        env:
          PROMOTE_APP: ${{ needs.resolve-deploy-plan.outputs.promote_app }}
          PROMOTE_MIGRATE: ${{ needs.resolve-deploy-plan.outputs.promote_migrate }}
          PROMOTE_ZERO: ${{ needs.resolve-deploy-plan.outputs.promote_zero }}
        run: |
          set -euo pipefail

          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          sha_tag="sha-${GITHUB_SHA}"
          promoted=0

          promote() {
            local service="$1"
            local image="${REGISTRY}/${repo}/${service}"
            echo "Promoting ${image}:${sha_tag} -> ${image}:production"
            docker buildx imagetools create \
              --tag "${image}:production" \
              "${image}:${sha_tag}"
            promoted=1
          }

          if [ "${PROMOTE_APP}" = "true" ]; then
            promote app
          fi

          if [ "${PROMOTE_MIGRATE}" = "true" ]; then
            promote migrate
          fi

          if [ "${PROMOTE_ZERO}" = "true" ]; then
            promote zero
          fi

          if [ "${promoted}" -eq 0 ]; then
            echo "No production tags to promote for this commit."
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.resolve-deploy-plan.outputs.deployments != ''
    needs:
      - promote-production
      - resolve-deploy-plan
    uses: MikaelSiidorow/systems/.github/workflows/k8s-rollout.yml@main
    with:
      namespace: refinery
      deployments: ${{ needs.resolve-deploy-plan.outputs.deployments }}
    secrets:
      HEADSCALE_PREAUTH_KEY: ${{ secrets.HEADSCALE_AUTH_KEY }}
      K8S_DEPLOY_KUBECONFIG: ${{ secrets.K8S_DEPLOY_KUBECONFIG }}
